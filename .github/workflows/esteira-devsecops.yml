name: Pipeline Seguro CI/CD - DevSecOps (Modo Auditoria)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: leomax2002/caixaverso_bancobox_dia2

jobs:
  # ============================================================
  # ESTACAO 1 - DETECCAO DE SEGREDOS (Gitleaks)
  # Modo auditoria: achados sao reportados, mas nao interrompem
  # a execucao da esteira.
  # ============================================================
  deteccao-segredos:
    name: "1 - Deteccao de Segredos (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rodar Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Registrar resultado do Gitleaks
        if: always()
        run: |
          echo "## Resultado da deteccao de segredos (Gitleaks)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado da verificacao: ${{ steps.gitleaks.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.gitleaks.outcome }}" != "success" ]; then
            echo "ATENCAO: o Gitleaks encontrou achados ou nao concluiu normalmente."
            echo "Pipeline em modo AUDITORIA: a execucao continuara."
          fi

  # ============================================================
  # ESTACAO 2 - SAST (Semgrep)
  # Analisa o codigo-fonte com regras OWASP e de seguranca.
  # Modo auditoria: achados ERROR sao reportados sem bloqueio.
  # ============================================================
  sast-semgrep:
    name: "2 - SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: deteccao-segredos
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o Semgrep
        run: pip install semgrep

      - name: Rodar o Semgrep (OWASP + auditoria de seguranca)
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --json --output=semgrep-results.json

      - name: Avaliar resultados do SAST em modo auditoria
        run: |
          ERROS=$(jq '[.results[] | select(.extra.severity=="ERROR")] | length' semgrep-results.json)
          AVISOS=$(jq '[.results[] | select(.extra.severity!="ERROR")] | length' semgrep-results.json)

          echo "Achados criticos (ERROR): $ERROS | Avisos: $AVISOS"
          echo "## Resultado do SAST (Semgrep)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Criticos: $ERROS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Avisos: $AVISOS" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ERROS" -gt 0 ]; then
            echo "ATENCAO: foram encontrados $ERROS achados ERROR no codigo."
            echo "Pipeline em modo AUDITORIA: a execucao continuara."
          fi

      - name: Publicar relatorios como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-semgrep
          path: semgrep-results.*

# ============================================================
# ESTACAO 3 - BUILD
# App Python. Instala dependencias e valida sintaxe/importacao.
# Falhas tecnicas de build continuam interrompendo a esteira.
# ============================================================
  build:
    name: "3 - Build"
    runs-on: ubuntu-latest
    needs: sast-semgrep
    
    defaults:
     run:
      working-directory: ./core-box

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        working-directory: core-box
        run: pip install -r requirements-dev.txt

      - name: instalar dependencias
        working-directory: core-box
        run: pip install --upgrade urllib3 requests

      - name: Validar sintaxe Python
        working-directory: core-box
        run: python -m compileall -q app

      - name: Verificar que a aplicacao importa sem erros
        working-directory: core-box
        run: python -c "import app"


    # ========================================================
    # ABUSE CASES
    # ========================================================
      - name: Executar testes de Abuse Cases
        working-directory: core-box
        continue-on-error: true
        run: pytest tests/test_abuse_cases.py -v
  # ============================================================
  # ESTACAO 4 - SCA (Trivy - dependencias)
  # Modo auditoria: CRITICAL/HIGH e MEDIUM/LOW sao reportados,
  # mas vulnerabilidades nao interrompem a esteira.
  # ============================================================
  sca-trivy:
    name: "4 - SCA (Trivy - dependencias)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - auditoria CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './core-box'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Trivy - relatorio informativo MEDIUM/LOW
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './core-box'
          scanners: 'vuln'
          severity: 'MEDIUM,LOW'
          exit-code: '0'
          format: 'table'

      - name: Publicar relatorio do Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-trivy-dependencias
          path: trivy-fs-results.sarif
          if-no-files-found: ignore

  # ============================================================
  # ESTACAO 5 - PACKAGE
  # Constroi e publica a imagem Docker no GHCR, tageada com o SHA.
  # Falhas tecnicas de build ou publicacao continuam bloqueando.
  # ============================================================
  package:
    name: "5 - Package (build e publicacao da imagem)"
    runs-on: ubuntu-latest
    needs: sca-trivy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./core-box
          file: ./core-box/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # ESTACAO 6 - SCAN DA IMAGEM (Trivy)
  # Modo auditoria: vulnerabilidades CRITICAL/HIGH sao exibidas,
  # mas nao interrompem a esteira.
  # ============================================================
  scan-imagem-trivy:
    name: "6 - Scan da Imagem (Trivy)"
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Trivy - auditoria CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'

      - name: Publicar relatorio da imagem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-trivy-imagem
          path: trivy-image-results.sarif
          if-no-files-found: ignore

  # ============================================================
  # ESTACAO 7 - DEPLOY EM HOMOLOGACAO + DAST (OWASP ZAP)
  # Modo auditoria: riscos altos sao reportados sem bloqueio.
  # As etapas permanecem no mesmo job para compartilhar a rede.
  # ============================================================
  homolog-e-dast:
    name: "7 - Deploy em Homologacao + DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: scan-imagem-trivy
    environment: homologacao
    steps:
      - uses: actions/checkout@v4

      - name: Subir a aplicacao no ambiente de teste
        run: |
          docker run -d --name app-homolog -p 5000:5000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "Aguardando a aplicacao responder..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "Aplicacao no ar."
              break
            fi
            sleep 3
          done

      - name: Rodar o OWASP ZAP (baseline scan)
        id: zap
        continue-on-error: true
        run: |
          mkdir -p zap-report && chmod 777 zap-report
          docker run --rm --network host \
            -v "$(pwd)/zap-report:/zap/wrk/:rw" \
            -v "$(pwd)/.zap/rules.tsv:/zap/rules.tsv:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 \
              -r zap-report.html -J zap-report.json \
              -c /zap/rules.tsv -I

      - name: Avaliar resultados do DAST em modo auditoria
        if: always()
        run: |
          if [ -f zap-report/zap-report.json ]; then
            ALTOS=$(jq '[.site[]?.alerts[]? | select(.riskcode=="3")] | length' zap-report/zap-report.json)
          else
            ALTOS="indisponivel"
          fi

          echo "Achados de risco ALTO: $ALTOS"
          echo "## Resultado do DAST (OWASP ZAP)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado da execucao do ZAP: ${{ steps.zap.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Achados de risco ALTO: $ALTOS" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ALTOS" != "indisponivel" ] && [ "$ALTOS" -gt 0 ]; then
            echo "ATENCAO: o DAST encontrou $ALTOS vulnerabilidades de risco ALTO."
            echo "Pipeline em modo AUDITORIA: a execucao continuara."
          fi

      - name: Publicar o relatorio do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-zap-dast
          path: zap-report/

      - name: Encerrar o container de teste
        if: always()
        run: docker rm -f app-homolog || true

  # ============================================================
  # ESTACAO 8 - APROVACAO HUMANA + DEPLOY EM PRODUCAO
  # O Environment "producao" continua sendo o controle humano.
  # ============================================================
  aprovacao-e-deploy-producao:
    name: "8 - Aprovacao Humana + Deploy em Producao"
    runs-on: ubuntu-latest
    needs: homolog-e-dast
    if: github.ref == 'refs/heads/main'
    environment:
      name: producao
    steps:
      - name: Confirmar aprovacao
        run: echo "Aprovado por um revisor humano. Prosseguindo com o deploy."

      - name: Deploy em producao
        run: |
          echo "Adapte este passo para o seu provedor (Kubernetes, ECS, VM, etc.)."
          echo "Exemplo: kubectl set image deployment/app app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ============================================================
  # RESUMO DA ESTEIRA - notificacao e auditoria
  # ============================================================
  resumo-da-esteira:
    name: "Resumo da Esteira"
    runs-on: ubuntu-latest
    needs: [deteccao-segredos, sast-semgrep, sca-trivy, scan-imagem-trivy, homolog-e-dast]
    if: always()
    steps:
      - name: Publicar o resumo no sumario da execucao
        run: |
          echo "# Resumo da Esteira Segura - Modo Auditoria" >> "$GITHUB_STEP_SUMMARY"
          echo "| Etapa | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Segredos | ${{ needs.deteccao-segredos.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SAST | ${{ needs.sast-semgrep.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SCA | ${{ needs.sca-trivy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Imagem | ${{ needs.scan-imagem-trivy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DAST | ${{ needs.homolog-e-dast.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Achados de seguranca sao reportados e nao bloqueiam a execucao." >> "$GITHUB_STEP_SUMMARY"

      - name: Notificar em caso de falha tecnica (exemplo com Slack)
        if: contains(needs.*.result, 'failure')
        run: |
          echo "Aqui entraria a chamada ao seu webhook de notificacao."
          echo 'curl -X POST -H "Content-type: application/json" --data "{\"text\":\"Pipeline apresentou falha tecnica\"}" $SLACK_WEBHOOK_URL'
