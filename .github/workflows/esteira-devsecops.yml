name: Pipeline Seguro CI/CD - DevSecOps (Security Gates Ativos)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: leomax2002/caixaverso_bancobox_dia2

jobs:
  # ============================================================
  # ESTACAO 1 - DETECCAO DE SEGREDOS (Gitleaks)
  # Security Gate: qualquer segredo exposto interrompe a esteira.
  # ============================================================
  deteccao-segredos:
    name: "1 - Deteccao de Segredos (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com historico completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Rodar Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Registrar resultado do Gitleaks
        if: always()
        run: |
          echo "## Resultado da deteccao de segredos (Gitleaks)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado da verificacao: ${{ steps.gitleaks.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.gitleaks.outcome }}" != "success" ]; then
            echo "BLOQUEIO: o Gitleaks encontrou segredos ou falhou na verificacao."
          fi

  # ============================================================
  # ESTACAO 2 - SAST (Semgrep)
  # Security Gate: achados com severidade ERROR bloqueiam a esteira.
  # ============================================================
  sast-semgrep:
    name: "2 - SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: deteccao-segredos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar o Semgrep
        run: pip install semgrep

      - name: Rodar o Semgrep (OWASP + auditoria de seguranca)
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --json --output=semgrep-results.json

      - name: Publicar relatorios como artefato
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorio-semgrep
          path: semgrep-results.*

      - name: Security Gate - Avaliar resultados do SAST
        run: |
          ERROS=$(jq '[.results[] | select(.extra.severity=="ERROR")] | length' semgrep-results.json)
          AVISOS=$(jq '[.results[] | select(.extra.severity!="ERROR")] | length' semgrep-results.json)

          echo "Achados criticos (ERROR): $ERROS | Avisos: $AVISOS"
          echo "## Resultado do SAST (Semgrep)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Criticos: $ERROS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Avisos: $AVISOS" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ERROS" -gt 0 ]; then
            echo "BLOQUEIO: foram encontrados $ERROS achados ERROR no codigo."
            exit 1
          fi

  # ============================================================
  # ESTACAO 3 - BUILD E ABUSE CASES
  # Security Gate: falhas de compilacao ou testes de abuso bloqueiam.
  # ============================================================
  build:
    name: "3 - Build e Abuse Cases"
    runs-on: ubuntu-latest
    needs: sast-semgrep

    env:
      BOX_SECRET_KEY: ${{ secrets.BOX_SECRET_KEY }}
      BOX_JWT_SECRET: ${{ secrets.BOX_JWT_SECRET }}
      BOX_PSTI_API_KEY: ${{ secrets.BOX_PSTI_API_KEY }}
      BOX_SMS_GATEWAY_TOKEN: ${{ secrets.BOX_SMS_GATEWAY_TOKEN }}
      WTF_CSRF_ENABLED: "false"

    defaults:
      run:
        working-directory: ./core-box

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r requirements-dev.txt
          pip install --upgrade urllib3 requests

      - name: Validar sintaxe Python
        run: python -m compileall -q app

      - name: Verificar que a aplicacao importa sem erros
        run: python -c "import app"

      - name: Security Gate - Executar testes de Abuse Cases
        run: pytest tests/test_abuse_cases.py -v

  # ============================================================
  # ESTACAO 4 - SCA (Trivy - dependencias)
  # Security Gate: vulnerabilidades CRITICAL/HIGH bloqueiam a esteira.
  # ============================================================
  sca-trivy:
    name: "4 - SCA (Trivy - dependencias)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy - relatorio informativo MEDIUM/LOW
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './core-box'
          scanners: 'vuln'
          severity: 'MEDIUM,LOW'
          exit-code: '0'
          format: 'table'

      - name: Security Gate - Trivy CRITICAL/HIGH
        id: trivy_fs
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './core-box'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Publicar relatorio do Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorio-trivy-dependencias
          path: trivy-fs-results.sarif
          if-no-files-found: ignore

  # ============================================================
  # ESTACAO 5 - PACKAGE
  # Constroi e publica a imagem Docker no GHCR, tageada com o SHA.
  # ============================================================
  package:
    name: "5 - Package (build e publicacao da imagem)"
    runs-on: ubuntu-latest
    needs: sca-trivy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./core-box
          file: ./core-box/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # ESTACAO 6 - SCAN DA IMAGEM (Trivy)
  # Security Gate: CVEs CRITICAL/HIGH corrigiveis bloqueiam deploy.
  # ============================================================
  scan-imagem-trivy:
    name: "6 - Scan da Imagem (Trivy)"
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Security Gate - Trivy Imagem CRITICAL/HIGH
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

      - name: Publicar relatorio da imagem
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorio-trivy-imagem
          path: trivy-image-results.sarif
          if-no-files-found: ignore

  # ============================================================
  # ESTACAO 7 - DEPLOY EM HOMOLOGACAO + DAST (OWASP ZAP)
  # Security Gate: riscos altos (riskcode 3) ou ausencia de
  # relatorio bloqueiam a promocao para producao.
  # ============================================================
  homolog-e-dast:
    name: "7 - Deploy em Homologacao + DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: scan-imagem-trivy
    environment: homologacao
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Subir a aplicacao no ambiente de teste
        run: |
          docker run -d --name app-homolog -p 8000:8000 \
            -e BOX_SECRET_KEY="${{ secrets.BOX_SECRET_KEY }}" \
            -e BOX_JWT_SECRET="${{ secrets.BOX_JWT_SECRET }}" \
            -e BOX_PSTI_API_KEY="${{ secrets.BOX_PSTI_API_KEY }}" \
            -e BOX_SMS_GATEWAY_TOKEN="${{ secrets.BOX_SMS_GATEWAY_TOKEN }}" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "Aguardando a aplicacao responder..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "Aplicacao no ar."
              exit 0
            fi
            sleep 3
          done

          echo "ERRO: A aplicacao nao respondeu na porta 8000. Logs do container:"
          docker logs app-homolog
          exit 1

      - name: Rodar o OWASP ZAP (baseline scan)
        id: zap
        continue-on-error: true
        run: |
          mkdir -p zap-report && chmod 777 zap-report
          docker run --rm --network host \
            -v "$(pwd)/zap-report:/zap/wrk/:rw" \
            -v "$(pwd)/.zap/rules.tsv:/zap/rules.tsv:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 \
              -r zap-report.html -J zap-report.json \
              -c /zap/rules.tsv -I

      - name: Publicar o relatorio do ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorio-zap-dast
          path: zap-report/

      - name: Encerrar o container de teste
        if: always()
        run: docker rm -f app-homolog || true

      - name: Security Gate - Avaliar resultados do DAST
        run: |
          if [ ! -f zap-report/zap-report.json ]; then
            echo "BLOQUEIO: relatorio zap-report.json nao foi gerado."
            echo "## Resultado do DAST (OWASP ZAP)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: FALHA (relatorio ausente)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          ALTOS=$(jq '[.site[]?.alerts[]? | select(.riskcode=="3")] | length' zap-report/zap-report.json)
          MEDIOS=$(jq '[.site[]?.alerts[]? | select(.riskcode=="2")] | length' zap-report/zap-report.json)

          echo "Achados de risco ALTO: $ALTOS | MEDIO: $MEDIOS"
          echo "## Resultado do DAST (OWASP ZAP)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Achados de risco ALTO: $ALTOS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Achados de risco MEDIO: $MEDIOS" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ALTOS" -gt 0 ]; then
            echo "BLOQUEIO: o DAST encontrou $ALTOS vulnerabilidades de risco ALTO."
            exit 1
          fi

  # ============================================================
  # ESTACAO 8 - APROVACAO HUMANA + DEPLOY EM PRODUCAO
  # So executa se TODOS os Security Gates anteriores passarem.
  # ============================================================
  aprovacao-e-deploy-producao:
    name: "8 - Aprovacao Humana + Deploy em Producao"
    runs-on: ubuntu-latest
    needs: homolog-e-dast
    if: github.ref == 'refs/heads/main'
    environment:
      name: producao
    steps:
      - name: Confirmar aprovacao
        run: echo "Aprovado por um revisor humano. Prosseguindo com o deploy."

      - name: Deploy em producao
        run: |
          echo "Adapte este passo para o seu provedor (Kubernetes, ECS, VM, etc.)."
          echo "Exemplo: kubectl set image deployment/app app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ============================================================
  # RESUMO DA ESTEIRA - notificacao e auditoria
  # ============================================================
  resumo-da-esteira:
    name: "Resumo da Esteira"
    runs-on: ubuntu-latest
    needs: [deteccao-segredos, sast-semgrep, build, sca-trivy, scan-imagem-trivy, homolog-e-dast]
    if: always()
    steps:
      - name: Publicar o resumo no sumario da execucao
        run: |
          echo "# Resumo da Esteira Segura - Security Gates" >> "$GITHUB_STEP_SUMMARY"
          echo "| Etapa | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 1 - Segredos (Gitleaks) | ${{ needs.deteccao-segredos.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 2 - SAST (Semgrep) | ${{ needs.sast-semgrep.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 3 - Build & Abuse Cases | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 4 - SCA (Trivy FS) | ${{ needs.sca-trivy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 6 - Scan Imagem (Trivy) | ${{ needs.scan-imagem-trivy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 7 - DAST (OWASP ZAP) | ${{ needs.homolog-e-dast.result }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Notificar em caso de bloqueio ou falha
        if: contains(needs.*.result, 'failure')
        run: |
          echo "Pipeline bloqueada por Security Gate ou falha tecnica."
