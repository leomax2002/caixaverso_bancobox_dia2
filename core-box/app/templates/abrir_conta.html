{% extends "base.html" %}{% block titulo %}Abrir conta{% endblock %}{% block subtitulo %}Abra sua conta em minutos{% endblock %}
{% block conteudo %}
{% if enviados %}<div class="info">Recebemos seus documentos! {% for e in enviados %}<br><span>{{ e }}</span>{% endfor %}</div>{% endif %}
<form method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="cpf">CPF</label>
  <input id="cpf" name="cpf" placeholder="000.000.000-00">
  <label for="nome">Nome completo</label>
  <input id="nome" name="nome">
  <label for="documento">Foto do documento</label>
  <input id="documento" type="file" name="documento" accept="image/*,.pdf">
  <label for="selfie">Selfie</label>
  <input id="selfie" type="file" name="selfie" accept="image/*">
  <button class="btn" type="submit">Enviar</button>
</form>
{% endblock %}
