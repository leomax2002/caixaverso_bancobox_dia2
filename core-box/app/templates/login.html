{% extends "base.html" %}{% block titulo %}Entrar{% endblock %}{% block subtitulo %}Bem-vindo ao seu banco{% endblock %}
{% block conteudo %}
<form method="post" action="/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="cpf">CPF</label>
  <input id="cpf" name="cpf" value="{{ cpf or '' }}" placeholder="000.000.000-00" autocomplete="username">
  {% if erro %}<div class="err"><b>{{ erro }}</b></div>{% endif %}
  <label for="senha">Senha de acesso (6 números)</label>
  <input id="senha" name="senha" type="password" maxlength="6" autocomplete="current-password">
  <label><input type="checkbox" name="lembrar"> Lembrar neste aparelho</label>
  <button class="btn" type="submit">Entrar</button>
</form>
<a class="btn sec" href="/recuperar">Esqueci minha senha</a>
<a class="btn sec" href="/abrir-conta">Abrir minha conta</a>
{% endblock %}
