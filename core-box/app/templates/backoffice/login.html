{% extends "base.html" %}{% block titulo %}Backoffice{% endblock %}{% block subtitulo %}BOX BACKOFFICE — acesso de agência{% endblock %}
{% block conteudo %}
{% if erro %}<div class="err">{{ erro }}</div>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="usuario">Usuário</label>
  <input id="usuario" name="usuario" autocomplete="username">
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password">
  <button class="btn" type="submit">Entrar</button>
</form>
{% endblock %}
